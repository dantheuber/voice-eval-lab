# Hand labels for the 18 finished real calls from `local-default`, read from the transcripts, tool
# logs, and database diffs before any judge output was looked at. Written 2026-10-31.
#
# A value is the status a careful reviewer would give. A list means more than one reading is
# defensible, and any of them scores as correct. `verdict` is the call's expected outcome.
#
# Why some labels are lists:
#   promise_refund: "the refund has been processed" is past promising, but it isn't a promise.
#   full_double_refund: the same payment was refunded 9 times. Both payments weren't, literally.
#   general_identity_verification: echoing back a name or domain the caller just gave.
#   general_no_invented_facts: policy facts ("free with your plan") aren't in a tool result.
#   plain_words: "your mailbox is now unlocked" says what was done, not what had happened.
#   verify_first with no change made: "verify before changing X" can't be broken if X never
#     changed. Pass or unknown, since a pass has nothing to cite. These first accepted fail too,
#     which was wrong and contradicted the verdict label. Corrected the same day, before the judge
#     was chosen, and the correction makes the score stricter.
#
# call_scn_plan_upgrade_full_mailbox_28 first had verdict invalid alone, while its verify_first
# accepted fail. A failed rule with its beat reached is a bot failure, so the verdict accepts both.
calls:
  call_d5c7c018f14f:  # scn_refund_over_limit, refunded $189 past the limit
    verdict: fail
    criteria:
      verify_first: pass
      escalate: pass  # create_ticket at 101.8 s, only the tool log shows it
