# The recommended stack, called local-quality in docs/research/benchmarks-2026-10.md. It has no LFM
# models, so nothing here carries a revenue limit. Pocket presets are CC0 and CC-BY only.
# No audio_analyst: LFM3-Audio, Gemma 4 E2B, and Voxtral all found 0 of 20 planted defects, which is
# chance. Delivery measurements cover this, and the seam stays for a model that does better.
id: local-default
label: "Local: Qwen stack"
description: "Qwen3-ASR, Qwen3.5-4B, Phonon. 833 ms plain turn and 2.0 s tool turn, 12 of 12 tool sessions from speech."
live_capable: true
roles:
  stt_live: {type: http_transcriptions, base_url: "http://127.0.0.1:18101", name: qwen3-asr-0.6b, word_timing: false}
  # Whisper, not the live STT: Parakeet reports confidence 1.0 on every word, Qwen3-ASR reports none,
  # and pronunciation checks need real word probabilities from a separate model family.
  stt_eval: {type: whisper_cpp, base_url: "http://127.0.0.1:18104", name: whisper-large-v3-q5}
  tts_bot: {type: phonon_tts, base_url: "http://127.0.0.1:18103", name: phonon-31m-bot, voice_id: Easton}
  tts_caller: {type: pocket_tts, base_url: "http://127.0.0.1:18106", name: pocket-18m}
  llm_support: {type: openai_compat, base_url: "http://127.0.0.1:18102/v1", name: qwen3.5-4b, timeout_s: 120}
  llm_caller: {type: openai_compat, base_url: "http://127.0.0.1:18102/v1", name: qwen3.5-4b-caller, timeout_s: 120}
  llm_judge: {type: openai_compat, base_url: "http://127.0.0.1:18105/v1", name: qwen3.8-27b, timeout_s: 600}
services:
  - name: qwen-asr
    port: 18101
    startup_timeout_s: 180
    env: {LD_LIBRARY_PATH: .runtime/llama-vulkan/llama-b12017}
    command:
      - ".runtime/llama-vulkan/llama-b12017/llama-server"
      - "--host"
      - "127.0.0.1"
      - "--port"
      - "18101"
      - "--no-webui"
      - "-m"
      - ".runtime/models/ggml-org__Qwen3-ASR-0.6B-GGUF/Qwen3-ASR-0.6B-Q8_0.gguf"
      - "-mm"
      - ".runtime/models/ggml-org__Qwen3-ASR-0.6B-GGUF/mmproj-Qwen3-ASR-0.6B-Q8_0.gguf"
      - "--temp"
      - "0"
      - "-c"
      - "8192"
      - "-np"
      - "2"
      - "-ngl"
      - "999"
  - name: llm
    port: 18102
    startup_timeout_s: 180
    env: {LD_LIBRARY_PATH: .runtime/llama-vulkan/llama-b12017}
    command:
      - ".runtime/llama-vulkan/llama-b12017/llama-server"
      - "--host"
      - "127.0.0.1"
      - "--port"
      - "18102"
      - "--no-webui"
      - "-m"
      - ".runtime/models/unsloth__Qwen3.5-4B-GGUF/Qwen3.5-4B-Q4_K_M.gguf"
      - "--jinja"
      - "--reasoning"
      - "off"
      - "-c"
      - "32768"
      - "-np"
      - "2"
      - "-ngl"
      - "999"
  - name: phonon
    port: 18103
    startup_timeout_s: 120
    env: {HF_HOME: .runtime/hf, HF_HUB_OFFLINE: "1"}
    command:
      - ".runtime/venvs/bench/bin/python"
      - "scripts/phonon_server.py"
      - "--port"
      - "18103"
  - name: pocket-tts
    port: 18106
    startup_timeout_s: 180
    env: {HF_HOME: .runtime/hf}
    command:
      - ".runtime/venvs/bench/bin/pocket-tts"
      - "serve"
      - "--host"
      - "127.0.0.1"
      - "--port"
      - "18106"
      - "--language"
      - "english_18m_2026-10"
  - name: whisper
    port: 18104
    startup_timeout_s: 120
    env: {LD_LIBRARY_PATH: .runtime/toolchain/lib}
    command:
      - ".runtime/whisper.cpp/build/bin/whisper-server"
      - "-m"
      - ".runtime/models/whisper/ggml-large-v3-q5_0.bin"
      - "--host"
      - "127.0.0.1"
      - "--port"
      - "18104"
      - "-l"
      - "en"
      - "-t"
      - "8"
  - name: judge
    port: 18105
    startup_timeout_s: 300
    env: {LD_LIBRARY_PATH: .runtime/llama-vulkan/llama-b12017}
    command:
      - ".runtime/llama-vulkan/llama-b12017/llama-server"
      - "--host"
      - "127.0.0.1"
      - "--port"
      - "18105"
      - "--no-webui"
      - "-m"
      - ".runtime/models/unsloth__Qwen3.8-27B-GGUF/Qwen3.8-27B-UD-Q4_K_M.gguf"
      - "--jinja"
      - "--reasoning"
      - "auto"
      - "-c"
      - "32768"
      - "-np"
      - "1"
      - "-ngl"
      - "999"
      - "--temp"
      - "0.1"
