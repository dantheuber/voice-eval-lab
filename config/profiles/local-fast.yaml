# The lowest latency cascade, and the smallest: 2.4 GB of GPU memory for the live stack.
# License: LFM models are under the LFM Open License v1.0, whose commercial grant ends at USD 10
# million in annual revenue. Fine here. A larger company adopting this needs a license from Liquid.
# No audio_analyst: LFM3-Audio, Gemma 4 E2B, and Voxtral all found 0 of 20 planted defects, which is
# chance. Delivery measurements cover this, and the seam stays for a model that does better.
id: local-fast
label: "Local: fastest cascade"
description: "Parakeet, LFM3-1.7B, Phonon. 681 ms plain turn and 1.1 s tool turn, but 9 of 12 tool sessions, and Parakeet can loop on repeated digits."
live_capable: true
roles:
  stt_live: {type: http_transcriptions, base_url: "http://127.0.0.1:18101", name: parakeet-tdt-0.6b-v3, trust_confidence: false}
  # Whisper, not the live STT: Parakeet reports confidence 1.0 on every word, Qwen3-ASR reports none,
  # and pronunciation checks need real word probabilities from a separate model family.
  stt_eval: {type: whisper_cpp, base_url: "http://127.0.0.1:18104", name: whisper-large-v3-q5}
  tts_bot: {type: phonon_tts, base_url: "http://127.0.0.1:18103", name: phonon-31m-bot, voice_id: Easton}
  tts_caller: {type: phonon_tts, base_url: "http://127.0.0.1:18103", name: phonon-31m-caller}
  llm_support: {type: openai_compat, base_url: "http://127.0.0.1:18102/v1", name: lfm3-1.7b, timeout_s: 120}
  llm_caller: {type: openai_compat, base_url: "http://127.0.0.1:18102/v1", name: lfm3-1.7b-caller, timeout_s: 120}
  llm_judge: {type: openai_compat, base_url: "http://127.0.0.1:18105/v1", name: qwen3.8-27b, timeout_s: 600}
services:
  - name: parakeet
    port: 18101
    startup_timeout_s: 120
    env: {LD_LIBRARY_PATH: .runtime/nemo/nemo-speech-0.3.0-linux-x86_64-vulkan/lib}
    command:
      - ".runtime/nemo/nemo-speech-0.3.0-linux-x86_64-vulkan/bin/nemo-speech"
      - "serve"
      - "--no-ui"
      - "--port"
      - "18101"
      - "--asr-model"
      - ".runtime/models/nvidia__parakeet/parakeet-tdt-0.6b-v3.q8_0.gguf"
      - "--device"
      - "vulkan:0"
  - name: llm
    port: 18102
    startup_timeout_s: 180
    env: {LD_LIBRARY_PATH: .runtime/llama-vulkan/llama-b12017}
    command:
      - ".runtime/llama-vulkan/llama-b12017/llama-server"
      - "--host"
      - "127.0.0.1"
      - "--port"
      - "18102"
      - "--no-webui"
      - "-m"
      - ".runtime/models/LiquidAI__LFM3-1.7B-GGUF/LFM3-1.7B-Q4_K_M.gguf"
      - "--jinja"
      - "--reasoning"
      - "off"
      - "-c"
      - "32768"
      - "-np"
      - "2"
      - "-ngl"
      - "999"
      - "--temp"
      - "0.1"
      - "--top-k"
      - "50"
      - "--repeat-penalty"
      - "1.1"
  - name: phonon
    port: 18103
    startup_timeout_s: 120
    env: {HF_HOME: .runtime/hf, HF_HUB_OFFLINE: "1"}
    command:
      - ".runtime/venvs/bench/bin/python"
      - "scripts/phonon_server.py"
      - "--port"
      - "18103"
  - name: whisper
    port: 18104
    startup_timeout_s: 120
    env: {LD_LIBRARY_PATH: .runtime/toolchain/lib}
    command:
      - ".runtime/whisper.cpp/build/bin/whisper-server"
      - "-m"
      - ".runtime/models/whisper/ggml-large-v3-q5_0.bin"
      - "--host"
      - "127.0.0.1"
      - "--port"
      - "18104"
      - "-l"
      - "en"
      - "-t"
      - "8"
  - name: judge
    port: 18105
    startup_timeout_s: 300
    env: {LD_LIBRARY_PATH: .runtime/llama-vulkan/llama-b12017}
    command:
      - ".runtime/llama-vulkan/llama-b12017/llama-server"
      - "--host"
      - "127.0.0.1"
      - "--port"
      - "18105"
      - "--no-webui"
      - "-m"
      - ".runtime/models/unsloth__Qwen3.8-27B-GGUF/Qwen3.8-27B-UD-Q4_K_M.gguf"
      - "--jinja"
      - "--reasoning"
      - "auto"
      - "-c"
      - "32768"
      - "-np"
      - "1"
      - "-ngl"
      - "999"
      - "--temp"
      - "0.1"
