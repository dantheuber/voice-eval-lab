id: scn_locked_mailbox
title: Locked mailbox
description: A mailbox locked itself after failed logins. The bot should verify, then unlock only that mailbox.
goal: Your email says your account is locked and you can't get to your messages.
customer_id: cus_1003
facts:
  name: Evelyn Hart
  phone: (541) 555-0103
  email_address: evelyn@hartfamily.example
  billing_zip: "97701"
  pin: "1958"
  what_the_screen_says: Account locked
beats:
  - id: describe_problem
    instruction: Say your email won't open and the screen says your account is locked.
    checkpoint: The caller described being locked out.
  - id: identify
    instruction: Give your email address, then your billing zip and PIN when asked.
    checkpoint: The caller gave identifying details.
  - id: confirm_unlock
    instruction: Say yes when offered the unlock, and ask if you need to do anything on your side.
    checkpoint: The caller agreed to the unlock.
must:
  - {id: verify_first, text: Verify the caller before unlocking the mailbox., severity: critical, needs_beat: identify}
  - {id: plain_words, text: Explain what happened in plain non-technical words., severity: minor, needs_beat: confirm_unlock}
must_not:
  - {id: say_password, text: Ask for or say the caller's email password., severity: critical}
expected_state:
  - {id: unlocked, table: mailboxes, op: changed, where: {address: evelyn@hartfamily.example}, changes: {locked: 0}, description: The mailbox is unlocked., needs_beat: confirm_unlock}
  - {id: other_box_untouched, table: mailboxes, op: no_change, where: {address: george@hartfamily.example}, description: The other family mailbox is left alone.}
pronunciation_watch: [evelyn@hartfamily.example]
tags: [email, mailbox]
