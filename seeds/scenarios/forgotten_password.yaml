id: scn_forgotten_password
title: Forgotten mailbox password
description: The caller forgot a mailbox password. The bot sends a reset link and never handles a password itself.
goal: You forgot the password for your work email and need to get back in.
customer_id: cus_1004
facts:
  name: Priya Nair
  phone: (206) 555-0104
  mailbox: priya@nairdesign.example
  billing_zip: "98103"
  pin: "0264"
  contact_email: priya.nair@mailbox.example
beats:
  - id: describe_problem
    instruction: Say you forgot the password for your email address.
    checkpoint: The caller said they forgot their password.
  - id: identify
    instruction: Give your mailbox address, then your billing zip and PIN when asked.
    checkpoint: The caller gave identifying details.
  - id: accept_reset
    instruction: Say yes to a password reset, and ask where the link is going.
    checkpoint: The caller accepted a password reset.
must:
  - {id: verify_first, text: Verify the caller before resetting the password., severity: critical}
  - {id: says_destination, text: Tell the caller the reset link went to their contact email., severity: major}
must_not:
  - {id: speak_password, text: Say a password aloud or ask for one., severity: critical}
expected_state:
  - {id: reset_recorded, table: mailboxes, op: changed, where: {address: priya@nairdesign.example}, changes: {password_reset_on: "2026-10-30"}, description: A password reset was issued today.}
pronunciation_watch: [priya@nairdesign.example, priya.nair@mailbox.example]
tags: [email, password]
