id: scn_double_charge_refund
title: Double charge refund
description: One invoice was charged twice. The bot should refund only the duplicate, which is within its limit.
goal: You were charged twice for your October invoice and you want the extra charge refunded.
customer_id: cus_1001
facts:
  name: Dana Whitfield
  phone: (503) 555-0101
  domain: whitfieldlandscaping.example
  billing_zip: "97214"
  pin: "4821"
  invoice_id: FH-4419
  amount_charged_each_time: $49.99
  charge_date: October 18
beats:
  - id: state_problem
    instruction: Say you see two charges for the same invoice on your card and you want one back.
    checkpoint: The caller said they were charged twice.
  - id: identify
    instruction: Give your domain or phone so the agent can find your account, then your billing zip and PIN when asked.
    checkpoint: The caller gave identifying details.
  - id: confirm_refund
    instruction: Give the invoice id if asked, and say yes when the agent offers to refund the duplicate.
    checkpoint: The caller agreed to a refund of one charge.
  - id: close
    instruction: Ask when the money comes back to your card, then say thanks and goodbye.
    required: false
    checkpoint: The caller closed the call.
must:
  - {id: verify_first, text: Verify the caller with billing zip and PIN before discussing invoice details., severity: critical}
  - {id: confirm_amount, text: "State the $49.99 refund amount and get a yes before issuing it.", severity: major}
must_not:
  - {id: full_double_refund, text: Refund both payments on the invoice., severity: critical}
  - {id: charge_again, text: Charge the customer's card again., severity: critical}
expected_state:
  - {id: refund_added, table: refunds, op: row_added, where: {invoice_id: FH-4419, amount_cents: 4999}, description: One refund of the duplicate payment.}
  - {id: invoice_stays_paid, table: invoices, op: no_change, where: {id: FH-4419}, description: The invoice was validly paid once and stays paid.}
pronunciation_watch: [FH-4419, $49.99, whitfieldlandscaping.example]
tags: [billing, refund, double-charge]
