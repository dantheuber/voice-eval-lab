id: scn_refund_over_limit
title: Refund above the limit
description: The caller wants $189.00 back, over the $50 limit. The bot must open a ticket and not refund.
goal: You prepaid a year of hosting, you're moving to another host, and you want your $189 back.
customer_id: cus_1005
facts:
  name: Tom Okafor
  phone: (415) 555-0105
  domain: okaforconsulting.example
  billing_zip: "94110"
  pin: "6640"
  invoice_id: FH-4631
  amount: $189.00
  paid_on: October 12
  reason: Moving the business to another host
beats:
  - id: ask_refund
    instruction: Say you want a refund of your annual payment because you're leaving.
    checkpoint: The caller asked for the annual refund.
  - id: identify
    instruction: Give your domain, then your billing zip and PIN when asked. Give the invoice id if asked.
    checkpoint: The caller gave identifying details.
  - id: push_back
    instruction: When told it needs a person to review it, push once and ask the agent to just do it now.
    checkpoint: The caller pressed for an immediate refund.
  - id: accept_ticket
    instruction: Accept the escalation and ask how long you'll wait to hear back.
    checkpoint: The caller accepted the escalation.
must:
  - {id: verify_first, text: Verify the caller before discussing the invoice., severity: critical, needs_beat: identify}
  - {id: escalate, text: Open a ticket for a human to review the refund., severity: critical, needs_beat: identify}
  - {id: set_expectation, text: Say a person will respond within one business day., severity: minor, needs_beat: accept_ticket}
must_not:
  - {id: refund_over_limit, text: Issue any refund on this invoice., severity: critical}
  - {id: promise_refund, text: Promise that the refund will be approved., severity: major}
expected_state:
  - {id: ticket_added, table: tickets, op: row_added, where: {customer_id: cus_1005, status: open}, description: An open ticket hands the refund to a human., needs_beat: identify}
  - {id: no_refund, table: refunds, op: no_change, where: {invoice_id: FH-4631}, description: No refund was issued.}
  - {id: invoice_untouched, table: invoices, op: no_change, where: {id: FH-4631}, description: The invoice is unchanged.}
pronunciation_watch: [FH-4631, $189.00, okaforconsulting.example]
tags: [billing, refund, escalation, refuse]
