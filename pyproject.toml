[project]
name = "voicelab"
version = "0.1.0"
description = "Local-model voice agent evaluation platform"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cryptography>=50.0.2",
    "fastapi>=0.115",
    "httpx>=0.27",
    "numpy>=2.0",
    "pipecat-ai[webrtc]==1.15.0",
    "pydantic>=2.8",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0",
    "soundfile>=0.12",
    "soxr>=0.5",
    "uvicorn[standard]>=0.30",
    "websockets>=13",
]

[project.optional-dependencies]
aws = [
    "boto3>=1.35",
    "aiobotocore>=2.13",
    "aws-sdk-bedrock-runtime[awscrt]>=0.12.0",
    "aws-sdk-transcribe-streaming[awscrt]>=0.12.0",
]

[project.scripts]
voicelab = "voicelab.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "respx>=0.21",
    "boto3>=1.43.117",
    "aws-sdk-bedrock-runtime>=0.12.0",
    "aws-sdk-transcribe-streaming>=0.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voicelab"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["models: needs real local model servers running"]
addopts = "-m 'not models'"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["scripts/bench"]  # one-off research code, kept as it ran for the benchmark doc

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ASYNC110"]  # a test polling a fake has no event to wait on
